# TASK-016 local production stack.
# Development stack remains docker-compose.yml and is intentionally untouched.
# Start with:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
name: ecommerce-agent-prod

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env.production}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ecommerce_agent}
      MYSQL_USER: ${MYSQL_USER:-ecommerce_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env.production}
    volumes:
      - mysql_data_prod:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data_prod:/data
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
    logging: *default-logging

  qdrant:
    image: qdrant/qdrant:v1.20.1
    restart: unless-stopped
    volumes:
      - qdrant_data_prod:/qdrant/storage
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - >
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333;
          printf "GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3;
          grep -q "healthz check passed" <&3'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    logging: *default-logging

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: "no"
    env_file:
      - .env.production
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      # Root credentials are only for MySQL initialization, never for app/migrate.
      MYSQL_ROOT_PASSWORD: ""
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - data
    command:
      - python
      - -m
      - alembic
      - -c
      - backend/alembic.ini
      - upgrade
      - head
    logging: *default-logging

  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      RAG_QDRANT_URL: http://qdrant:6333
      RAG_STORAGE_DIR: /app/data/uploads
      RAG_EMBEDDING_CACHE_DIR: /app/.cache/huggingface
      # Do not expose a MySQL root credential to the runtime app.
      MYSQL_ROOT_PASSWORD: ""
    volumes:
      - uploads_data_prod:/app/data/uploads
      - model_cache_prod:/app/.cache/huggingface
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    networks:
      - edge
      - data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging: *default-logging

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      app:
        condition: service_healthy
    networks:
      - edge
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1/healthz | grep -q ok"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

networks:
  edge:
    driver: bridge
  data:
    driver: bridge
    internal: true

volumes:
  mysql_data_prod:
  redis_data_prod:
  qdrant_data_prod:
  uploads_data_prod:
  model_cache_prod:
    external: true
    name: ecommerce-agent-prod_model_cache_prod
